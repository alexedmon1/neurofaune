# Neurofaune Default Configuration
# This file contains default parameters for rodent MRI preprocessing
# Study-specific configurations should override these values

# Study information
study:
  name: "Rodent MRI Study"
  code: "STUDY001"
  species: "rat"  # or "mouse"
  strain: ""      # e.g., "Sprague-Dawley", "Wistar", "C57BL/6"

# Directory structure (neurovrai-compatible)
paths:
  study_root: "/path/to/study"  # overridden by init_study / a study config.yaml
  raw: "${paths.study_root}/raw"
  bruker: "${paths.raw}/bruker"
  bids: "${paths.raw}/bids"
  derivatives: "${paths.study_root}/derivatives"
  transforms: "${paths.study_root}/transforms"
  qc: "${paths.study_root}/qc"
  work: "${paths.study_root}/work"
  network:
    roi: "${paths.study_root}/network/roi"
    covnet: "${paths.study_root}/network/covnet"
    classification: "${paths.study_root}/network/classification"
    regression: "${paths.study_root}/network/regression"
    mcca: "${paths.study_root}/network/mcca"
    edge_regression: "${paths.study_root}/network/edge_regression"
    fc_graph_theory: "${paths.study_root}/network/fc_graph_theory"
  analysis:
    tbss: "${paths.study_root}/analysis/tbss"
    vbm: "${paths.study_root}/analysis/vbm"
    voxelwise_fmri: "${paths.study_root}/analysis/voxelwise_fmri"
    mvpa: "${paths.study_root}/analysis/mvpa"

# Atlas configuration
atlas:
  name: "SIGMA"
  base_path: "/path/to/SIGMA_scaled"  # Scaled 10x for FSL/ANTs compatibility

  # Study-space atlas (reoriented to match study acquisition orientation)
  # Set up using: setup_study_atlas() from neurofaune.templates.slice_registration
  # This is REQUIRED for registration - reorients SIGMA once rather than every image
  study_space:
    base_path: "${paths.study_root}/atlas/SIGMA_study_space"
    template: "${atlas.study_space.base_path}/SIGMA_InVivo_Brain_Template.nii.gz"
    template_masked: "${atlas.study_space.base_path}/SIGMA_InVivo_Brain_Template_Masked.nii.gz"
    brain_mask: "${atlas.study_space.base_path}/SIGMA_InVivo_Brain_Mask.nii.gz"
    gm_prob: "${atlas.study_space.base_path}/SIGMA_InVivo_GM.nii.gz"
    wm_prob: "${atlas.study_space.base_path}/SIGMA_InVivo_WM.nii.gz"
    csf_prob: "${atlas.study_space.base_path}/SIGMA_InVivo_CSF.nii.gz"
    parcellation: "${atlas.study_space.base_path}/SIGMA_InVivo_Anatomical_Brain_Atlas.nii.gz"

  # Modality-specific slice extraction
  slice_definitions:
    # DTI: Hippocampal region only (11 slices)
    dwi:
      start: 15
      end: 25
      description: "Hippocampus-centered for DTI analysis"

    # fMRI: Broader cortical coverage
    func:
      start: 10
      end: 35
      description: "Cortical and subcortical regions"

    # Anatomical: Full atlas
    anat:
      start: 0
      end: -1  # -1 means all slices
      description: "Complete brain atlas"

    # MSME: Custom range
    msme:
      start: 12
      end: 30
      description: "Region-specific T2 mapping"

    # MTR: Same as anatomical
    mtr:
      start: 0
      end: -1
      description: "Whole-brain MTR"

# Age cohort definitions (for developmental studies)
cohorts:
  p30:
    age_days: 30
    description: "Postnatal day 30 (juvenile)"
  p60:
    age_days: 60
    description: "Postnatal day 60 (young adult)"
  p90:
    age_days: 90
    description: "Postnatal day 90 (adult)"

# Execution settings
execution:
  plugin: "MultiProc"
  n_procs: 6
  stop_on_first_crash: false
  crashdump_dir: "${paths.work}/crash"

# ANTs configuration (rodent-optimized parameters)
ants:
  num_threads: 4
  dimension: 3

  # N4 bias correction
  n4:
    bspline_fitting_distance: 50  # Smaller for rodent brains
    shrink_factor: 2
    convergence_threshold: 0.0001
    n_iterations: [50, 50, 50, 50]

  # Registration parameters
  registration:
    # Rodent brains are smaller, need adjusted parameters
    initial_moving_transform: "Rigid"
    metric: "MI"  # Mutual Information
    metric_weight: 1.0
    radius_or_number_of_bins: 32
    sampling_strategy: "Regular"
    sampling_percentage: 0.25
    convergence_threshold: 1e-6
    convergence_window_size: 10
    shrink_factors: [8, 4, 2, 1]
    smoothing_sigmas: [3, 2, 1, 0]
    transforms: ["Rigid", "Affine", "SyN"]
    transform_parameters:
      Rigid: [0.1]
      Affine: [0.1]
      SyN: [0.1, 3, 0]  # [gradient_step, update_field_sigma, total_field_sigma]

  # Atropos segmentation
  atropos:
    n_classes: 3  # CSF, GM, WM
    prior_probability: 0.0
    iterations: 5
    mrf_smoothing_factor: 0.1
    mrf_radius: [1, 1, 1]

# Anatomical preprocessing (T2w for rodents)
anatomical:
  # Primary modality (T2w is standard for rodents)
  primary_contrast: "T2w"

  # Skull stripping method and parameters
  skull_strip:
    method: "atropos_bet"          # 'atropos_bet' (two-pass), 'atropos', 'bet', or 'auto'
    n_classes: 5                   # Atropos tissue classes (background, CSF, GM, WM, skull)
    atropos_iterations: 5          # Atropos convergence iterations
    atropos_convergence: 0.0       # Atropos convergence threshold
    mrf_smoothing_factor: 0.1      # Markov Random Field smoothing
    mrf_radius: [1, 1, 1]          # MRF neighborhood radius
    tissue_confidence_threshold: 0.35  # Min probability for tissue assignment in segmentation
    morphological_closing_iterations: 2  # Closing iterations for mask cleanup
    foreground_otsu_multiplier: 0.3     # Otsu threshold multiplier for foreground mask
    # Adaptive BET parameters (used in atropos_bet two-pass method)
    adaptive_bet:
      cnr_thresholds: [1.5, 3.0]       # CNR boundaries for frac selection
      frac_mapping: [0.20, 0.28, 0.38] # Frac values for [low, medium, high] CNR

  # Tissue segmentation (GM/WM/CSF), decoupled from skull stripping.
  # The atropos_bet skull-strip method reuses its own posteriors for tissue maps.
  # For methods that yield no posteriors (e.g. bet4animal), a standalone Atropos
  # segmentation runs inside the brain mask instead, so GM/WM/CSF maps (for
  # aCompCor nuisance regressors + WM analyses) are always produced. Classes are
  # labeled by mean T2w intensity within the mask (WM darkest < GM < CSF brightest).
  tissue_segmentation:
    enabled: true                  # set false to skip tissue maps when no posteriors
    n_classes: 3                   # GM/WM/CSF (3 required for intensity labeling)
    iterations: 5                  # Atropos convergence iterations
    convergence: 0.0               # Atropos convergence threshold
    mrf_smoothing_factor: 0.1      # Markov Random Field smoothing
    mrf_radius: [1, 1, 1]          # MRF neighborhood radius

  # Legacy BET parameters (used when skull_strip.method = 'bet')
  bet:
    frac: 0.3  # Lower threshold for rodent brains
    vertical_gradient: 0.0  # Rodent brains have less vertical bias
    robust: true
    reduce_bias: true
    remove_eyes: false  # Less relevant for rodents

  # N4 bias field correction parameters
  n4:
    iterations: [50, 50, 30, 20]   # Iterations per resolution level
    shrink_factor: 3               # Downsampling factor for speed
    convergence_threshold: 1.0e-6  # Convergence threshold

  # Intensity normalization
  intensity_normalization:
    factor: 1000.0                 # Multiply brain-extracted image by this factor

  # Registration to atlas/template (cohort-age-adaptive params)
  registration:
    method: "ants"
    output_warped_image: true
    output_inverse_warped_image: true
    smoothing_sigmas: [[3, 2, 1, 0], [2, 1, 0]]
    shrink_factors: [[8, 4, 2, 1], [4, 2, 1]]
    iterations: [[1000, 500, 250, 100], [100, 70, 50, 20]]
    convergence_threshold: 1.0e-6
    convergence_window_size: 10
    syn_params: [0.1, 3.0, 0.0]   # [gradient_step, update_field_sigma, total_field_sigma]
    metric_bins: 32                # Number of histogram bins for MI metric

  # QC settings
  run_qc: true

# Diffusion preprocessing
diffusion:
  # Pre-eddy denoising + Gibbs-ringing removal (dipy; applied to raw 4-D in order
  # MP-PCA denoise -> Gibbs removal, before intensity norm / masking / eddy).
  denoise_method: "dwidenoise"  # label only; MP-PCA is done via dipy mppca
  denoise:
    enabled: true               # MP-PCA denoising (dipy.denoise.localpca.mppca)
    patch_radius: 2
  degibbs:
    enabled: true               # Gibbs-ringing removal (dipy.denoise.gibbs)
    num_processes: 1

  # Intensity normalization (RECOMMENDED - enabled by default)
  # Different Bruker ParaVision reconstruction settings can result in vastly
  # different intensity scales (e.g., 0-50 vs 0-300000) due to different
  # VisuCoreDataSlope values. This causes BET to fail on low-intensity data.
  # Normalization ensures consistent intensity ranges for reliable brain extraction.
  intensity_normalization:
    enabled: true  # Set to false to disable (not recommended)
    target_max: 10000.0  # Target maximum intensity after normalization

  # Skull stripping for DWI b0
  skull_strip:
    method: "atropos_bet"          # 'atropos_bet', 'atropos', 'bet', or 'auto'
    n_classes: 3                   # 3-class: brightest class = brain (proven for DWI b0)

  # Brain extraction method for DWI (legacy key, use skull_strip instead)
  brain_extraction:
    method: atropos  # 'atropos' or 'bet'

  # BET parameters (used when brain_extraction.method = 'bet')
  bet:
    frac: 0.25  # More conservative for DWI
    robust: true

  # TOPUP distortion correction (if reverse PE images available)
  topup:
    readout_time: 0.05  # Study-specific, check protocol
    pe_direction: "AP"  # or "PA", "LR", "RL"
    config: "b02b0.cnf"  # FSL config file

  # Eddy current and motion correction
  eddy:
    use_cuda: true  # GPU acceleration (10-50x faster)
    flm: "linear"
    slm: "linear"
    fwhm: 0
    niter: 5
    s2v_lambda: 1
    s2v_niter: 5
    repol: true                        # Outlier replacement
    phase_encoding_direction: "0 -1 0" # Acquisition PE direction for acqparams.txt
    readout_time: 0.05                 # Total readout time (seconds)
    data_is_shelled: true              # Skip shell auto-detection (Bruker multi-shell data)
    slice_padding: 2                   # Pad N slices on each side before eddy

  # DTI fitting
  dti:
    fit_method: "WLS"  # Weighted least squares
    min_bval: 5  # Treat as b0 if below this

  # Advanced models
  advanced:
    # DKI (requires multi-shell)
    dki:
      enabled: false
      min_shells: 2

    # NODDI (requires multi-shell)
    noddi:
      enabled: false
      use_amico: true  # 100x faster than DIPY
      min_shells: 2

  # BEDPOSTX (for tractography)
  bedpostx:
    enabled: false
    use_gpu: true
    n_fibres: 2
    model: 2  # Ball-and-sticks model

  # Spatial normalization to atlas
  normalization:
    enabled: true
    target_space: "SIGMA"
    reference_image: "FA"  # Use FA for registration

  # QC settings
  run_qc: true

# Functional preprocessing
functional:
  # Acquisition parameters
  tr: 1.0  # Repetition time (seconds) - study-specific
  te: 30.0  # Echo time (ms) - study-specific, or list for multi-echo

  # Slice timing correction (run BEFORE motion correction)
  # Corrects for temporal differences in slice acquisition within each TR
  slice_timing:
    enabled: false  # DISABLED - was causing zebra stripe artifacts
    order: custom  # 'sequential_ascending', 'sequential_descending', 'interleaved', 'interleaved_even_first', 'custom'
    custom_order: [0, 2, 4, 6, 8, 1, 3, 5, 7]  # Bruker interleaved odd-first for 9 slices
    reference_slice: middle  # Slice to align to (middle = middle in time, or integer)

  # Brain extraction method for BOLD
  # 'adaptive'  – per-slice BET (original; works for T2w-like contrast)
  # 'template'  – Z-NCC projection of cohort template brain mask (recommended for EPI)
  skull_strip_method: adaptive

  # Template-guided skull stripping parameters (skull_strip_method: template)
  skull_strip_template_dilation: 2   # in-plane dilation in BOLD voxels (safety margin)

  # Adaptive per-slice BET parameters (skull_strip_method: adaptive)
  skull_strip_adaptive:
    target_ratio: 0.15           # Target 15% extraction per slice
    frac_range: [0.30, 0.90]     # Wide range accommodates all protocols (2× voxel size requires 2× frac)
    frac_step: 0.05              # Test 13 frac values per slice (0.30, 0.35, ..., 0.90)
    use_R_flag: true             # BET robust center estimation (0.8% vs 0.9% with explicit COG)
    invert_intensity: false      # Standard T2w contrast (inversion worsens to 2.7% difference)

  # Legacy BET parameters (kept for reference, not used with preprocessing approach)
  bet:
    frac: 0.3
    functional: true  # Optimized for BOLD

  # Motion correction
  motion_correction:
    method: "mcflirt"  # or "ants"
    reference: "middle"  # Use middle volume as reference

  # Spatial smoothing
  smoothing:
    fwhm: 6  # mm (matching old pipeline to eliminate zebra stripes)

  # Temporal filtering
  filtering:
    highpass: 0.01  # Hz
    lowpass: 0.1    # Hz

  # TEDANA multi-echo ICA denoising (auto-enabled for multi-echo input)
  tedana:
    tedpca: 0.95           # PCA component selection: float=variance % (0.95=95%), int=exact count,
                           # or 'kundu','aic','kic','mdl'. If too slow, use n_volumes/2 (IRC805 pattern)
    tree: kundu            # Decision tree: 'kundu' or 'kundu_tedort'

  # Denoising strategy
  denoising:
    # Rodent-specific ICA denoising (replaces ICA-AROMA)
    ica:
      enabled: true
      n_components: null  # Let MELODIC automatically determine optimal dimensionality (recommended)
      classification_mode: "score"  # 'score' (recommended) or 'threshold'
      motion_threshold: 0.40  # Motion correlation threshold
      edge_threshold: 0.80  # Edge fraction threshold
      csf_threshold: 0.70  # CSF overlap threshold
      freq_threshold: 0.60  # High-frequency power threshold

    # ACompCor (anatomical nuisance regression)
    # Extracts principal components from CSF/WM to remove physiological noise
    # Can be used as alternative to ICA or complementary with it
    acompcor:
      enabled: true  # Enable to extract physiological noise components
      num_components: 5  # Number of components from each tissue (CSF, WM)
      variance_threshold: 0.5  # Minimum tissue probability threshold

    # GLM confound regression - motion regressors always computed
    glm:
      enabled: false  # Set to true if not using ICA

  # Motion QC thresholds
  motion_qc:
    fd_threshold: 0.05              # Framewise displacement threshold (mm, real/unscaled space)

  # Registration (DISABLED - under development)
  # Registration to anatomical and atlas spaces will be added in future releases
  registration:
    enabled: false  # Disable for now
    method: "ants"
    cost_function: "corratio"  # Correlation ratio (faster than BBR)
    dof: 6  # Rigid registration to anatomical

  # Spatial normalization (DISABLED - under development)
  normalization:
    enabled: false  # Disable for now
    target_space: "SIGMA"
    reuse_transforms: true  # Reuse anatomical transforms

  # Resting-state analysis parameters
  analysis:
    falff:
      low_freq: 0.01   # Lower bound (Hz) for ALFF/fALFF
      high_freq: 0.08   # Upper bound (Hz) — Zou et al. (2008) canonical range
    reho:
      neighborhood: 27   # 7 (faces), 19 (faces+edges), or 27 (full 3x3x3 cube)

  # QC settings
  run_qc: true

# Single-voxel spectroscopy (Bruker PRESS -> FSL-MRS)
spectroscopy:
  # FSL-MRS basis set: a directory of per-metabolite JSON files, or an LCModel
  # .basis file. Must match the sequence, echo time and field strength -- e.g.
  # PRESS TE 20 ms at 7T. Required; there is no sensible default.
  basis: null

  # Directory holding fsl_mrs / fsl_mrs_preproc. Leave null to use $FSLDIR/bin
  # then $PATH. FSL 6.0.7+ bundles them, so no separate conda env is needed;
  # set this only to point at a different fsl_mrs build.
  fsl_bin: null

  # Read rawdata.job0 so coils and individual averages are preserved. Set false
  # to use Bruker's pre-averaged reconstruction, which disables coil
  # combination, shot alignment and outlier rejection.
  prefer_raw: true

  # Preprocessing chain:
  #   internal        - coil combination, alignment, outlier removal, averaging
  #                     and eddy-current correction, but NOT fsl_mrs_preproc's
  #                     final shift_to_reference/phase_correct. Those search a
  #                     hardcoded 2.9-3.1 ppm window and, when they pick the
  #                     wrong point, displace and invert the spectrum so no
  #                     metabolite can be fit. The converter already references
  #                     the spectrum on tCr, so they are redundant here.
  #   fsl_mrs_preproc - the stock FSL pipeline, for comparison.
  preproc: "internal"

  # Preprocessing parameters (shared by both chains)
  # Align averages in windows of this many shots. Single rodent averages are
  # too noisy for per-shot alignment: on CPZ test data the default per-shot
  # alignment gave NAA SNR 6.0 against 28.7 with a 32-shot window. Set to 0 to
  # skip alignment entirely.
  align_window: 32
  remove_outliers: true          # Drop averages unlike the rest (motion)
  remove_water: false            # HLSVD residual water removal. Off by default:
                                 # it costs SNR on sessions that do not need it,
                                 # so it is applied automatically as a retry when
                                 # a fit comes back unquantifiable.

  # Fitter: 'fsl_mrs' or 'lcmodel'. LCModel is a useful independent check --
  # same basis, same preprocessed FID, different implementation -- and models
  # the macromolecule baseline internally, which the FSL-MRS JSON basis
  # conversion loses. On CPZ test sessions it agreed with fsl_mrs on the major
  # metabolite ratios while reporting much lower CRLBs (2-6% against 10-30%).
  fitter: "fsl_mrs"
  lcmodel:
    basis: null                  # An LCModel .basis file, NOT the JSON dir above
    bin: null                    # Directory holding the lcmodel binary
    license: null                # Defaults to /srv/.lcmodel/license then ~/.lcmodel/license

  # Zero-order phasing: 'search' scans the full circle for the phase giving the
  # most absorptive spectrum, scored over the whole metabolite region; 'tcr'
  # phases on the creatine peak alone. The search is strictly better on CPZ
  # data -- identical or higher SNR on all 52 sessions, six of them by 16-107%
  # -- because a single-point estimate inherits that point's noise.
  phase_method: "search"

  # Export the fit as CSV curves (ppm, data, fit, baseline, residual, and one
  # column per metabolite) alongside fsl_mrs' HTML report, which contains no
  # plottable data. fsl_mrs only.
  export_curves: true

  # Macromolecule / lipid areas, measured from the exported curves after the
  # metabolite fit rather than from basis components. MM components placed in
  # the basis are collinear with the polynomial baseline and destabilise the
  # metabolites; measuring afterwards cannot. Requires export_curves.
  #
  # Only MM09 is validated (baseline-order CV 7.6%, on par with the
  # metabolites). MM12 is flagged provisional (CV 44%) and MM14/MM17 are not
  # reported at all -- see neurofaune/preprocess/utils/mrs/mm_quantify.py.
  quantify_mm: true
  mm_range: [0.2, 1.8]           # Region the envelope spline is fitted over
  mm_knot_spacing: 0.10          # Spline knot spacing, ppm; ~MM linewidth at 7T
  # MM-poor windows defining the zero level. Areas are measured against a line
  # through these, not against absolute zero: a pedestal runs the full width of
  # the spectrum and integrating from zero gives negative, unstable areas.
  mm_flanks: [[0.25, 0.60], [1.55, 1.80]]
  # Fit MM09 as a complex Lorentzian with a free phase, alongside the band
  # integral. The MM signal sits ~59 deg out of phase with the metabolites, so
  # a real-part band integral captures only cos(59) ~ 0.5 of it and has to stop
  # at 0.95 ppm to avoid the dispersion lobe. The lineshape fit estimates the
  # phase instead, making the area independent of the band edge.
  mm_lineshape: true

  # Fitting (fsl_mrs)
  ppmlim: [0.2, 4.2]             # Fit range
  baseline: "poly,4"             # Higher order compensates for basis sets
                                 # without macromolecule components
  metab_groups: ["NAA"]          # Separate lineshape groups
  # Let the fit find the peak positions. Sessions vary by up to ~0.15 ppm in
  # where peaks land after preprocessing, and with a fixed shift a displaced
  # NAA fits to zero instead of moving.
  free_shift: true
  internal_ref: ["Cr", "PCr"]    # Falls back to NAA if this fits to zero
  combine:                       # Reported as sums
    - ["NAA", "NAAG"]
    - ["Cr", "PCr"]
    - ["GPC", "PCh"]
    - ["Glu", "Gln"]

  # Automatic placement check. The voxel is located from Bruker geometry
  # parameters, and a wrong convention there is silent -- the spectrum still
  # fits and the concentrations still look physiological, only the tissue
  # fractions are wrong. Scoring the voxel against the structure it was aimed
  # at makes that visible. target_structure is matched as a substring against
  # the atlas label table; leave null to skip the check.
  target_structure: null         # e.g. "hippocamp"
  atlas_labels: "${atlas.base_path}/SIGMA_InVivo_Anatomical_Brain_Atlas_Labels.csv"

  # QC settings
  run_qc: true

# MSME (Multi-Slice Multi-Echo) T2 mapping
msme:
  # Skull stripping for MSME data
  skull_strip:
    method: "adaptive"             # Per-slice BET; 'atropos_bet' fails on 5-slice MSME
    n_classes: 3                   # Fewer classes for partial-coverage data
    # Adaptive slice-wise parameters (used when method='adaptive')
    target_ratio: 0.15             # Target 15% extraction per slice
    frac_min: 0.3                  # Minimum frac to test
    frac_max: 0.8                  # Maximum frac to test
    frac_step: 0.05                # Test frac values in steps
    # COG estimation: offset from image center (in voxels)
    cog_offset_x: 0               # X offset from image center (positive = right)
    cog_offset_y: -40             # Y offset from image center (negative = down/inferior)

  # T2 fitting (legacy mono-exponential)
  fitting:
    method: "nonlinear"  # or "linear" (log-linear)
    bounds: [10, 500]  # T2 value bounds (ms)

  # NNLS-based T2 fitting and MWF calculation
  t2_fitting:
    n_components: 120              # Number of T2 components in NNLS spectrum
    t2_range: [10, 2000]           # T2 distribution range (ms) [min, max]
    lambda_reg: null               # null = auto via chi-square criterion; or fixed float
    myelin_water_cutoff: 25        # T2 cutoff for myelin water (ms)
    intra_extra_cutoff: 200        # T2 cutoff for IEW/CSF boundary (ms)

  # Geometry (from Bruker method file, set during study initialization)
  geometry:
    slice_thickness_mm: 0.8        # PVM_SliceThick
    slice_gap_mm: 0.0              # PVM_SPackArrSliceGap (0 if contiguous)
    in_plane_resolution_mm: null   # PVM_SpatResol; null = read from NIfTI header
    voxel_scale: 10.0              # Scale factor applied during Bruker → NIfTI conversion

  # Registration
  registration:
    method: "ants"
    target_space: "SIGMA"
    z_anchor: 18                   # Template slice for MSME middle slice (bypasses NCC scan)
    z_range: [13, 22]              # NCC search range (fallback if z_anchor is null)
    outlier_z_threshold: 3.0       # MAD multiplier for z-position outlier detection

  # QC settings
  run_qc: true

# MTR (Magnetization Transfer Ratio)
mtr:
  # MTR calculation
  calculation:
    # MTR = (M0 - Msat) / M0 * 100
    threshold: 0.0  # Minimum signal threshold

  # Registration
  registration:
    method: "ants"
    target_space: "SIGMA"

  # QC settings
  run_qc: true

# Quality control settings
qc:
  # Output format
  format: "html"  # HTML reports with interactive plots

  # Figure settings
  figures:
    dpi: 150
    format: "png"
    colormap: "viridis"

  # Thresholds for automatic flagging
  thresholds:
    # Motion (mm)
    max_framewise_displacement: 0.5
    max_mean_displacement: 0.3

    # Registration quality
    min_registration_correlation: 0.7

    # Signal quality
    min_tsnr: 50

    # DTI metrics (reasonable ranges for rodents)
    fa_range: [0, 1]
    md_range: [0, 0.003]  # mm²/s

# ---------------------------------------------------------------------------
# Structural connectivity (neurofaune.tractography)
# ---------------------------------------------------------------------------
tractography:
  # Directory containing the MRtrix3 binaries. Leave blank to resolve from
  # MRTRIX_BIN or PATH. MRtrix3 is not an FSL/ANTs-style system dependency for
  # this package -- only the tractography module needs it.
  #   micromamba create -p <prefix>/mrtrix3 -c mrtrix3 -c conda-forge mrtrix3
  mrtrix_bin: ""

  # Refuse acquisitions that cannot support a fibre orientation distribution.
  # A 6-direction scheme supports only lmax=2, which is angularly equivalent
  # to a tensor: connectome edges from such data are model artifact. Set false
  # to allow tensor-grade data through with a warning (FSL path only).
  require_csd: true

  # Fibre orientation distributions (MSMT-CSD when multi-shell).
  fod:
    # Cap on the WM spherical harmonic order. The actual order used is the
    # smaller of this and what the gradient scheme determines.
    max_lmax: 8
    # mtnormalise. Required for any cross-subject comparison of FOD amplitude
    # (fixel-based analysis, group connectome contrasts).
    normalise: true

  # Streamline generation.
  tckgen:
    algorithm: "iFOD2"          # iFOD2 (probabilistic) or SD_STREAM
    n_streamlines: "1M"
    cutoff: 0.05                # FOD amplitude termination threshold
    backtrack: true             # ACT backtracking
    seed_strategy: "auto"       # auto | gmwmi | mask
    # Lengths in REAL mm. Rodent data is stored 10x scaled (bids.voxel_scale),
    # so these are converted before being handed to MRtrix.
    step_mm: null               # null -> half the smallest voxel dimension
    min_length_mm: null
    max_length_mm: null

  # SIFT2. Without it, edges are raw streamline counts, which carry length and
  # geometry bias that does not cancel in a group contrast.
  sift2:
    enabled: true

  # Anatomically-constrained tractography. The 5TT is assembled from the
  # anatomical workflow's Atropos posteriors -- MRtrix's 5ttgen fsl relies on
  # FAST/FIRST and their human priors do not transfer to rodents.
  act:
    enabled: true
    # Split grey matter into cortical / subcortical using the propagated
    # atlas. Without it ACT tends to truncate streamlines in deep structures.
    use_atlas_subcortical_split: true

  # Connectome assembly.
  connectome:
    symmetric: true
    scale_invnodevol: false
    assignment_radius_mm: 0.4   # real mm
    # Drop nodes lying less than this fraction inside the DWI field of view.
    # Out-of-FOV nodes otherwise enter the matrix as structural zeros, which
    # shift group means rather than reading as missing. Measured in native
    # anatomical space -- measuring in DWI space under-detects clipped nodes.
    min_coverage: 0.5

  # Fixel-based analysis.
  fixel:
    template_voxel_size_mm: 0.125   # real mm
    n_permutations: 5000

  # FSL ball-and-sticks path (single-shell studies, or cross-checking MRtrix).
  fsl:
    # null -> derived from the volume count. Ball-and-N-sticks has 2+3N free
    # parameters; a configured value the data cannot constrain is reduced.
    n_fibres: null
    model: 2
    use_gpu: true
    n_samples: 5000
    distance_correction: true
